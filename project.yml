name: Inkling
options:
  bundleIdPrefix: com.nkalmykov
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Подпись Personal Team (SPEC, раздел 13): стабильная, разрешения не слетают при пересборке.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ZSX3ZW9FUR
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Inkling:
    type: application
    platform: macOS
    sources:
      - path: Inkling
        excludes:
          - Resources/Prompts
          - Resources/Web
          - Resources/Inkling.icon
      # Промпты по умолчанию копируются в бандл папкой, со структурой (SPEC, раздел 5).
      - path: Inkling/Resources/Prompts
        type: folder
        buildPhase: resources
      # Иконка в формате Icon Composer: слои, светлая/тёмная/тонированная версии собираются actool.
      - path: Inkling/Resources/Inkling.icon
        type: file
        buildPhase: resources
      # Рендер конспекта: HTML, CSS, render.js и зафиксированные KaTeX, mhchem, markdown-it.
      - path: Inkling/Resources/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nkalmykov.inkling
        PRODUCT_NAME: Inkling
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inkling
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: Inkling
        # Приложение запускает внешние CLI, песочница выключена (SPEC, раздел 1).
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  InklingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InklingTests
    dependencies:
      - target: Inkling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nkalmykov.inkling.tests

schemes:
  Inkling:
    build:
      targets:
        Inkling: all
        InklingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InklingTests

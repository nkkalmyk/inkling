name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали, что ожидали, что получили.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Версия Inkling и macOS
      placeholder: "0.5.0, macOS 26.1"
    validations: {required: true}
  - type: dropdown
    id: engine
    attributes:
      label: Движок
      options: [Claude Code, Codex, Ollama, Не относится]
  - type: textarea
    id: details
    attributes:
      label: Подробности из «Проверить подключение» или лог
      description: "Не прикладывайте свои конспекты, ключи и личные пути."

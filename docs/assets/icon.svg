<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Иконка Inkling для README: слои из Inkling/Resources/Inkling.icon, собранные в плоскую картинку. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#382872"/>
      <stop offset="1" stop-color="#0C0B21"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB547" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FF6F61" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B53CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="0.55" stop-color="#F5B83D"/>
      <stop offset="1" stop-color="#E8862A"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#E9E4FF" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <g filter="url(#soft)">
      <circle cx="690" cy="300" r="300" fill="url(#cool)"/>
      <circle cx="470" cy="610" r="380" fill="url(#warm)"/>
    </g>
    <g transform="translate(500 520) scale(1.22) translate(-512 -512)" filter="url(#shadow)">
      <path d="M470 430 C 500 420, 545 425, 548 452 L 506 690 C 500 728, 528 742, 566 712 C 584 698, 604 708, 594 730 C 560 790, 452 800, 434 742 C 428 722, 430 700, 434 680 Z" fill="url(#stem)"/>
      <g transform="translate(548 318) rotate(38)">
        <path d="M0 -118 C 34 -70, 72 -26, 72 18 A 72 72 0 1 1 -72 18 C -72 -26, -34 -70, 0 -118 Z" fill="url(#amber)"/>
        <ellipse cx="-24" cy="-6" rx="16" ry="30" fill="#FFFFFF" opacity="0.45"/>
      </g>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>

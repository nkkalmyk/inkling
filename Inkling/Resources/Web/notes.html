<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="notes.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>
<script src="vendor/markdown-it/markdown-it.umd.min.js"></script>
<script src="render.js"></script>
</head>
<body>
<header id="print-heading" hidden></header>
<main id="content"></main>
<script>
  // Вызывается из приложения. Сигнал «готово» уходит после загрузки шрифтов KaTeX: по нему можно печатать в PDF.
  // Шрифты KaTeX грузятся лениво: document.fonts.ready может сработать раньше, чем загрузка начнётся.
  // Поэтому грузим их явно, даём вёрстке устояться и только потом сообщаем, что можно печатать.
  // (requestAnimationFrame не годится: в невидимом окне печати он не срабатывает.)
  function katexFontsLoaded() {
    var faces = [];
    document.fonts.forEach(function (face) { if (face.family.indexOf('KaTeX') !== -1) faces.push(face.load().catch(function () {})); });
    return Promise.all(faces).then(function () { return document.fonts.ready; });
  }
  function nextFrames() {
    void document.body.offsetHeight;
    return new Promise(function (resolve) { setTimeout(resolve, 60); });
  }
  // Титул PDF: предмет, тема и дата над конспектом. В окне приложения не используется.
  window.inklingSetHeading = function (heading) {
    var el = document.getElementById('print-heading');
    el.innerHTML = '';
    [['subject', heading.subject], ['topic', heading.topic], ['date', heading.date]].forEach(function (part) {
      var node = document.createElement(part[0] === 'topic' ? 'h1' : 'p');
      node.className = 'print-' + part[0];
      node.textContent = part[1];
      el.appendChild(node);
    });
    el.hidden = false;
  };
  window.inklingShow = function (markdown) {
    document.getElementById('content').innerHTML = InklingRender.toHTML(markdown);
    katexFontsLoaded().then(nextFrames).then(function () {
      var errors = document.querySelectorAll('.katex-error').length;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rendered) {
        window.webkit.messageHandlers.rendered.postMessage({ errors: errors });
      }
    });
  };
</script>
</body>
</html>

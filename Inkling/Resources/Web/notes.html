<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="notes.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>
<script src="vendor/markdown-it/markdown-it.umd.min.js"></script>
<script src="diagram.js"></script>
<script src="render.js"></script>
</head>
<body>
<header id="print-heading" hidden></header>
<main id="content"></main>
<section id="related-lectures" class="related-lectures" aria-label="Связанные лекции" hidden></section>
<nav id="lecture-neighbors" class="lecture-neighbors" aria-label="Соседние лекции" hidden></nav>
<script>
  // Вызывается из приложения. Сигнал «готово» уходит после загрузки шрифтов KaTeX: по нему можно печатать в PDF.
  // Шрифты KaTeX грузятся лениво: document.fonts.ready может сработать раньше, чем загрузка начнётся.
  // Поэтому грузим их явно, даём вёрстке устояться и только потом сообщаем, что можно печатать.
  // (requestAnimationFrame не годится: в невидимом окне печати он не срабатывает.)
  function katexFontsLoaded() {
    var faces = [];
    document.fonts.forEach(function (face) { if (face.family.indexOf('KaTeX') !== -1) faces.push(face.load().catch(function () {})); });
    return Promise.all(faces).then(function () { return document.fonts.ready; });
  }
  function nextFrames() {
    void document.body.offsetHeight;
    return new Promise(function (resolve) { setTimeout(resolve, 60); });
  }
  // Титул PDF: предмет, тема и дата над конспектом. В окне приложения не используется.
  window.inklingSetHeading = function (heading) {
    var el = document.getElementById('print-heading');
    el.innerHTML = '';
    [['subject', heading.subject], ['topic', heading.topic], ['date', heading.date]].forEach(function (part) {
      var node = document.createElement(part[0] === 'topic' ? 'h1' : 'p');
      node.className = 'print-' + part[0];
      node.textContent = part[1];
      el.appendChild(node);
    });
    el.hidden = false;
  };
  // Ссылки на соседние лекции предмета под конспектом: «← прошлая · следующая →». Приложение ловит inkling-lecture://.
  window.inklingSetNeighbors = function (links) {
    var nav = document.getElementById('lecture-neighbors');
    nav.innerHTML = '';
    [['previous', '← '], ['next', '']].forEach(function (part) {
      var link = links[part[0]];
      var slot = document.createElement('span');
      slot.className = part[0];
      if (link) {
        var a = document.createElement('a');
        a.href = 'inkling-lecture://' + link.id;
        a.textContent = part[0] === 'previous' ? '← ' + link.title : link.title + ' →';
        a.title = part[0] === 'previous' ? 'Предыдущая лекция (⌘[)' : 'Следующая лекция (⌘])';
        slot.appendChild(a);
      }
      nav.appendChild(slot);
    });
    nav.hidden = !links.previous && !links.next;
  };
  // Ссылки по понятиям (первое упоминание понятия из другой лекции) и «Связанные лекции». Приходят из приложения
  // отдельно от текста и накладываются после каждой отрисовки.
  var concepts = { links: [], related: [] };
  var lastHTML = null;
  function lectureHref(id, anchor) { return 'inkling-lecture://' + id + (anchor ? '#' + anchor : ''); }
  function showRelated() {
    var box = document.getElementById('related-lectures');
    box.innerHTML = '';
    if (!concepts.related.length) { box.hidden = true; return; }
    var title = document.createElement('h4');
    title.textContent = 'Связанные лекции';
    var list = document.createElement('ul');
    concepts.related.forEach(function (item) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = lectureHref(item.lecture);
      a.textContent = item.title;
      li.appendChild(a);
      var parts = [];
      if (item.definedThere.length) parts.push('определены там: ' + item.definedThere.join(', '));
      if (item.definedHere.length) parts.push('определены здесь: ' + item.definedHere.join(', '));
      var note = document.createElement('span');
      note.className = 'note';
      note.textContent = parts.join(' · ');
      li.appendChild(note);
      list.appendChild(li);
    });
    box.appendChild(title);
    box.appendChild(list);
    box.hidden = false;
  }
  // Ссылки понятий приходят вторым вызовом после текста: разметка не разбирается заново, а берётся готовой
  // (раньше markdown-it и KaTeX проходили по всему конспекту дважды на каждое открытие; аудит 2026-11).
  window.inklingSetConcepts = function (value) {
    concepts = { links: value.links || [], related: value.related || [] };
    if (lastHTML !== null) present(); else showRelated();
  };
  // Прокрутка к разделу после перехода по ссылке на понятие. Только что созданная страница ещё не разложена,
  // поэтому прокручиваем после отрисовки (шрифты KaTeX загружены) или с небольшой задержкой, если она уже была.
  var pendingAnchor = null;
  function applyScroll() {
    var target = pendingAnchor && document.getElementById(pendingAnchor);
    if (target) { target.scrollIntoView({ block: 'start' }); pendingAnchor = null; }
  }
  window.inklingScrollTo = function (id) {
    pendingAnchor = id;
    setTimeout(applyScroll, 200);
  };
  window.inklingShow = function (markdown) {
    lastHTML = InklingRender.toHTML(markdown);
    present();
  };
  function present() {
    var content = document.getElementById('content');
    content.innerHTML = lastHTML;
    InklingRender.linkConcepts(content, concepts.links.map(function (link) {
      return { stems: link.stems, href: lectureHref(link.lecture, link.anchor), title: link.title };
    }));
    showRelated();
    katexFontsLoaded().then(nextFrames).then(function () {
      applyScroll();
      var errors = document.querySelectorAll('.katex-error').length;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rendered) {
        window.webkit.messageHandlers.rendered.postMessage({ errors: errors });
      }
    });
  }
</script>
</body>
</html>

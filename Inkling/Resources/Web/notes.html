<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="notes.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>
<script src="vendor/markdown-it/markdown-it.umd.min.js"></script>
<script src="render.js"></script>
</head>
<body>
<main id="content"></main>
<script>
  // Вызывается из приложения. Сигнал «готово» уходит после загрузки шрифтов KaTeX: по нему можно печатать в PDF.
  window.inklingShow = function (markdown) {
    document.getElementById('content').innerHTML = InklingRender.toHTML(markdown);
    document.fonts.ready.then(function () {
      var errors = document.querySelectorAll('.katex-error').length;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rendered) {
        window.webkit.messageHandlers.rendered.postMessage({ errors: errors });
      }
    });
  };
</script>
</body>
</html>

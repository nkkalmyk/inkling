<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Стеклянная линза за буквой, как циферблат Safari: преломляет свечение фона. -->
  <defs>
    <linearGradient id="lens" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9C2FF" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="352" fill="url(#lens)"/>
</svg>
